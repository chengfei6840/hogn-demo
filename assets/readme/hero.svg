<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">红光金具 · 智能报价原型</title>
  <desc id="desc">以金具串、子件 BOM 和报价版本为线索，连接询价到签发的业务流程。</desc>
  <rect width="1200" height="440" rx="20" fill="#f5f3ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <g id="identity" transform="translate(56 54)">
      <path d="M0 0h42v8H0z M0 16h28v8H0z M0 32h42v8H0z" fill="#b7202a"/>
      <text x="60" y="31" font-size="28" font-weight="700" fill="#24282b" letter-spacing="3">HOGN</text>
      <text x="0" y="125" font-size="56" font-weight="750" fill="#20272b">红光金具</text>
      <text x="0" y="193" font-size="56" font-weight="750" fill="#20272b">智能报价原型</text>
      <text x="2" y="250" font-size="24" fill="#555e62">让每次报价都有确认、有依据、有版本。</text>
      <path d="M0 290h530" stroke="#c8ccc9"/>
      <text x="0" y="328" font-size="21" fill="#555e62">询价协作</text>
      <text x="135" y="328" font-size="21" fill="#555e62">串型与子件</text>
      <text x="293" y="328" font-size="21" fill="#555e62">核价审批</text>
      <text x="429" y="328" font-size="21" fill="#b7202a" font-weight="650">报价快照</text>
    </g>
    <g id="bom-specimen" transform="translate(680 58)">
      <rect width="464" height="324" rx="12" fill="#ffffff"/>
      <text x="30" y="43" font-size="22" font-weight="650" fill="#20272b">金具串 → 子件 → 报价版本</text>
      <path d="M30 65h404" stroke="#dde1df"/>
      <g id="string-assembly" transform="translate(49 95)" stroke="#354347" stroke-width="4" fill="none">
        <circle cx="34" cy="16" r="14"/>
        <path d="M34 30v21M20 51h28v30H20zM34 81v25"/>
        <path d="M12 106h44v10H12zM12 122h44v10H12zM12 138h44v10H12z" fill="#e7ece9"/>
        <path d="M34 148v23M20 171h28v22H20zM34 193v12"/>
        <circle cx="34" cy="217" r="12"/>
      </g>
      <g id="bom-rows" transform="translate(133 108)">
        <path d="M0 8h260M0 57h260M0 106h260" stroke="#e1e5e2"/>
        <text x="0" y="36" font-size="22" fill="#354347">连接金具</text>
        <text x="0" y="85" font-size="22" fill="#354347">绝缘子组件</text>
        <text x="0" y="134" font-size="22" fill="#354347">导线连接件</text>
        <path d="M224 26l8 8 14-16M224 75l8 8 14-16M224 124l8 8 14-16" fill="none" stroke="#587667" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect y="161" width="260" height="42" rx="6" fill="#f8e9e8"/>
        <text x="18" y="189" font-size="21" font-weight="650" fill="#a51e28">确认结果随版本留存</text>
      </g>
    </g>
  </g>
</svg>
