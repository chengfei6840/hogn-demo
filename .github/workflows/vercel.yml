name: Vercel Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Vercel secrets
        run: |
          missing=
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secrets:$missing"
            echo "Add them in the repository Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npm ci
      - run: npm install --global vercel@59.17.0
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: |
          # Deploy from a git-less directory so Vercel does not attach the
          # commit author. Hobby projects block authors that are not linked
          # to a GitHub account, which left previous deploys in BLOCKED/UNKNOWN.
          tmp=$(mktemp -d)
          cp -a .vercel "$tmp/.vercel"
          cd "$tmp"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
