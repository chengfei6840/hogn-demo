<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect width="1120" height="700" fill="#fbfdfe"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1c3a52">图 2 · 报价包状态机（10 个状态 + 4 条回退路径）</text>
  <text x="24" y="52" font-size="12" fill="#6b8093">每次技术依据变化都会让 version + 1，并把「已确认」状态清空——版本号是门禁主键，不依赖人工清状态。</text>

  <!-- 主链 -->
  <g stroke="#4a7392" stroke-width="1.8" fill="none" marker-end="url(#a2)">
    <line x1="210" y1="130" x2="268" y2="130"/>
    <line x1="410" y1="130" x2="468" y2="130"/>
    <line x1="610" y1="130" x2="668" y2="130"/>
    <line x1="810" y1="130" x2="868" y2="130"/>
    <path d="M940 162 L940 296"/>
    <path d="M870 330 L742 330"/>
  </g>

  <!-- 终态分支 -->
  <g stroke="#4a7392" stroke-width="1.6" fill="none" marker-end="url(#a2)">
    <path d="M670 362 L670 412 L585 412 L585 468"/>
    <path d="M700 362 L700 412 L735 412 L735 468"/>
    <path d="M730 362 L730 412 L885 412 L885 468"/>
  </g>

  <!-- 回退路径 -->
  <g stroke="#c0803f" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a3)">
    <path d="M540 98 L540 64 L340 64 L340 96"/>
    <path d="M740 162 L740 196 L540 196 L540 164"/>
    <path d="M1010 330 L1080 330 L1080 620 L340 620 L340 164"/>
  </g>

  <!-- 自环：技术改动 -->
  <path d="M370 98 C370 66 410 66 410 98" stroke="#c0803f" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#a3)"/>

  <!-- 标注 -->
  <g font-size="11" fill="#a3682c">
    <text x="430" y="84">驳回 · 版本 +1</text>
    <text x="556" y="190">退回核价</text>
    <text x="760" y="600">创建新版本 → 回到并行协作（历史 U9 价转存为归档价）</text>
    
    
  </g>

  <!-- 阶段标签 -->
  <g font-size="10.5" font-weight="700" fill="#5b8aa8">
    <text x="214" y="112">02</text><text x="414" y="112">03</text><text x="614" y="112">04</text><text x="814" y="112">05</text>
  </g>

  <!-- 状态节点 -->
  <g>
    <rect x="70" y="98" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="140" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">资料整理</text>
    <text x="140" y="144" text-anchor="middle" font-size="10.5" fill="#5c7d95">登记资料·启动解析</text>

    <rect x="270" y="98" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="340" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">并行协作</text>
    <text x="340" y="144" text-anchor="middle" font-size="10.5" fill="#5c7d95">销售→技术 两次确认</text>

    <rect x="470" y="98" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="540" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">财务核价</text>
    <text x="540" y="144" text-anchor="middle" font-size="10.5" fill="#5c7d95">成本·毛利·方案</text>

    <rect x="670" y="98" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="740" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">审批签发</text>
    <text x="740" y="144" text-anchor="middle" font-size="10.5" fill="#5c7d95">按节点顺序处理</text>

    <rect x="870" y="98" width="140" height="64" rx="9" fill="#fdf3e3" stroke="#d3a86a" stroke-width="1.5"/>
    <text x="940" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#5c3d12">可出具报价</text>
    <text x="940" y="144" text-anchor="middle" font-size="10.5" fill="#8a6428">审批已过·待签发</text>

    <rect x="870" y="298" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="940" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">已出具</text>
    <text x="940" y="344" text-anchor="middle" font-size="10.5" fill="#5c7d95">可调价·可外发</text>

    <rect x="600" y="298" width="140" height="64" rx="9" fill="#e8f1f8" stroke="#7fa8c4" stroke-width="1.5"/>
    <text x="670" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1c3a52">客户议价中</text>
    <text x="670" y="344" text-anchor="middle" font-size="10.5" fill="#5c7d95">可改价·可登记成交</text>

    <rect x="520" y="468" width="130" height="56" rx="9" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.4"/>
    <text x="585" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3d33">已成交</text>
    <text x="585" y="510" text-anchor="middle" font-size="10" fill="#5f6f63">归档只读</text>

    <rect x="670" y="468" width="130" height="56" rx="9" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.4"/>
    <text x="735" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3d33">未成交</text>
    <text x="735" y="510" text-anchor="middle" font-size="10" fill="#5f6f63">归档只读</text>

    <rect x="820" y="468" width="130" height="56" rx="9" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.4"/>
    <text x="885" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3d33">已取消</text>
    <text x="885" y="510" text-anchor="middle" font-size="10" fill="#5f6f63">归档只读</text>
  </g>

  <!-- 边标签 -->
  <g font-size="11" fill="#41586b">
    <text x="948" y="236">签发（唯一签发节点执行）</text>
    <text x="772" y="322">登记外发</text>
    <text x="624" y="440">登记成交结果 + 依据</text>
    <text x="240" y="150" text-anchor="middle" font-size="10" fill="#6b8093">解析完成</text>
  </g>

  <!-- 说明块 -->
  <g transform="translate(24, 640)">
    <rect x="0" y="0" width="1072" height="44" rx="6" fill="#f4f8fb" stroke="#dde8f0"/>
    <text x="14" y="19" font-size="11.5" fill="#41586b">守卫条件：并行协作 → 财务核价 要求「销售确认版本 == 技术确认版本 == 当前版本」且技术缺项清零；</text>
    <text x="14" y="35" font-size="11.5" fill="#41586b">财务核价 → 审批签发 要求核价完整性通过（子件价齐、报价 &gt; 0、税率 0–100、计价口径已填）。</text>
  </g>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a7392"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0803f"/>
    </marker>
  </defs>
</svg>
